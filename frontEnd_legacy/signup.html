<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - VlogSphere</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Google Font for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <div class="header-content">
          <div class="logo">
            <h1>VlogSphere</h1>
          </div>
          <nav class="nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="add-vlog.html" class="nav-link">Add Vlog</a>
            <a href="login.html" class="nav-link">Login</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Sign Up Section -->
    <section class="auth-section">
      <div class="container">
        <div class="auth-wrapper">
          <div class="auth-card">
            <h2 class="auth-title">Create Your Account</h2>
            <p class="auth-subtitle">
              Join VlogSphere and start sharing your story
            </p>

            <!-- Error Message -->
            <div id="errorMessage" class="alert alert-error hidden">
              <strong>Error!</strong>
              <span id="errorText"
                >Something went wrong. Please try again.</span
              >
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="alert alert-success hidden">
              <strong>Success!</strong> Your account has been created
              successfully.
            </div>

            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form">
              <!-- Name Field -->
              <div class="form-group">
                <label for="name" class="form-label">Full Name *</label>
                <input
                  type="text"
                  id="name"
                  class="form-input"
                  placeholder="Enter your full name"
                  required
                />
                <span class="error-message" id="nameError"></span>
              </div>

              <!-- Role Selection -->
              <div class="form-group">
                <label for="role" class="form-label">Who are you? *</label>
                <select id="role" class="form-input form-select" required>
                  <option value="">-- Select your role --</option>
                  <option value="creator">Creator</option>
                  <option value="user">User</option>
                  <option value="admin">Admin</option>
                </select>
                <span class="error-message" id="roleError"></span>
              </div>

              <!-- Email Field -->
              <div class="form-group">
                <label for="email" class="form-label">Email Address *</label>
                <input
                  type="email"
                  id="email"
                  class="form-input"
                  placeholder="Enter your email address"
                  required
                />
                <span class="error-message" id="emailError"></span>
              </div>

              <!-- Password Field -->
              <div class="form-group">
                <label for="password" class="form-label">Password *</label>
                <input
                  type="password"
                  id="password"
                  class="form-input"
                  placeholder="Enter your password"
                  required
                />
                <small class="form-hint"
                  >Password must be at least 6 characters</small
                >
                <span class="error-message" id="passwordError"></span>
              </div>

              <!-- Confirm Password Field -->
              <div class="form-group">
                <label for="confirmPassword" class="form-label"
                  >Confirm Password *</label
                >
                <input
                  type="password"
                  id="confirmPassword"
                  class="form-input"
                  placeholder="Confirm your password"
                  required
                />
                <span class="error-message" id="confirmPasswordError"></span>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary btn-large btn-block">
                Create Account
              </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
              <span>OR</span>
            </div>

            <!-- Google Sign Up Button -->
            <button
              id="googleSignupBtn"
              class="btn btn-google btn-large btn-block"
            >
              <i class="fab fa-google"></i> Sign up with Google
            </button>

            <!-- Login Link -->
            <p class="auth-footer">
              Already have an account?
              <a href="login.html" class="auth-link">Log in here</a>
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Google Sign-In Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/signup.js"></script>
  </body>
</html>
