<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vlog Details - VlogSphere</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <div class="header-content">
          <div class="logo">
            <h1>VlogSphere</h1>
          </div>
          <nav class="nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="add-vlog.html" class="nav-link">Add Vlog</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Vlog Detail Section -->
    <section class="vlog-detail-section">
      <div class="container">
        <a href="index.html" class="back-link">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
          Back to Vlogs
        </a>

        <div id="loadingMessage" class="message">Loading vlog...</div>
        <div id="errorMessage" class="message error hidden">
          Unable to load vlog. Please go back and try again.
        </div>

        <div id="vlogDetailContainer" class="vlog-detail-container hidden">
          <div class="vlog-detail-wrapper">
            <!-- Video Section -->
            <div class="detail-video-section">
              <div class="detail-video">
                <iframe
                  id="detailVideoFrame"
                  title="Vlog Video"
                  allowfullscreen
                  loading="lazy"
                ></iframe>
              </div>
            </div>

            <!-- Content Section -->
            <div class="detail-content-section">
              <div class="detail-header">
                <div class="detail-meta-top">
                  <span id="detailCategory" class="detail-category"></span>
                  <span id="detailDate" class="detail-date"></span>
                </div>
                <h1 id="detailTitle" class="detail-title"></h1>
                <div class="detail-creator-info">
                  <span id="detailCreator" class="detail-creator"></span>
                </div>
              </div>

              <!-- Scrollable Description -->
              <div class="detail-description-container">
                <h3 class="detail-section-title">Description</h3>
                <p id="detailDescription" class="detail-description"></p>
              </div>

              <!-- Actions -->
              <div class="detail-actions">
                <button id="detailLikeBtn" class="detail-action-btn like-btn">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"
                    />
                  </svg>
                  <span id="detailLikeCount" class="detail-action-count"
                    >0</span
                  >
                </button>
                <button
                  id="detailDislikeBtn"
                  class="detail-action-btn dislike-btn"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"
                    />
                  </svg>
                  <span id="detailDislikeCount" class="detail-action-count"
                    >0</span
                  >
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>&copy; 2025 VlogSphere. Share your story with the world.</p>
      </div>
    </footer>

    <script src="js/vlogDetail.js"></script>
  </body>
</html>
